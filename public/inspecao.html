<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Registro de Inspeção Final</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #babbc5;
      padding: 20px;
    }

    .form-container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input, textarea, select {
      width: 95%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .checkboxes {
      margin-top: 10px;
    }

    .checkboxes label {
      font-weight: normal;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      background: green;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .result {
      margin-top: 20px;
      background: #e0ffe0;
      padding: 10px;
      border-radius: 5px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Registro de Inspeção Final</h2>
    <form id="formInspecao">
      <label>ID do Cilindro / OS</label>
      <input type="text" id="cilindroId" required>


      <label>Data da Inspeção</label>
      <input type="datetime-local" id="data" required>

      <label>Inspetor</label>
      <select name="inspetor" id="inspetor" required>
        <option value="">Selecione</option>
        <option value="Clovis de Assis">Clovis de Assis</option>
        <option value="Gilson Gonlçalves">Gilson Gonlçalves</option>
        <option value="Saulo Cunha">Saulo Cunha</option>
        <option value="Thiago Barbosa">Thiago Barbosa</option>
      </select>

      <label>Itens Verificados</label>
      <div class="checkboxes">
        <label><input type="checkbox" value="Pintura"> Pintura</label>
        <label><input type="checkbox" value="Travamento"> Travamento</label>
        <label><input type="checkbox" value="Dimensões"> Dimensões</label>
        <label><input type="checkbox" value="Acabamento"> Acabamento</label>
      </div>

      <label>Observações</label>
      <textarea id="obs" rows="3"></textarea>

      <label>Resultado</label>
      <select id="resultado" required>
        <option value="">Selecione</option>
        <option value="Aprovado">Aprovado</option>
        <option value="Reprovado">Reprovado</option>
      </select>

      <button type="submit">Registrar</button>
    </form>

    <div class="resultado" id="mensagem"></div>
  </div>

  <script>
    document.getElementById('formInspecao').addEventListener('submit', async function (e) {
      e.preventDefault();

      const itensSelecionados = Array.from(document.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);

      const dados = {
        cilindroId: document.getElementById('cilindroId').value,
        inspetor: document.getElementById('inspetor').value,
        data: document.getElementById('data').value,
        itens: itensSelecionados,
        obs: document.getElementById('obs').value,
        resultado: document.getElementById('resultado').value
      };

      try {
        const resposta = await fetch('http://192.168.0.225:3000/api/inspecao', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(dados)
})

        const msg = document.getElementById('mensagem');
        if (resposta.ok) {
          msg.style.display = 'block';
          msg.style.background = '#e0ffe0';
          msg.textContent = 'Inspeção registrada com sucesso!';
          document.getElementById('formInspecao').reset();
        } else {
          msg.style.display = 'block';
          msg.style.background = '#ffe0e0';
          msg.textContent = 'Erro ao registrar inspeção.';
        }
      } catch (erro) {
        console.error('Erro:', erro);
        alert('Erro na conexão com o servidor.');
      }
    });
  </script>
</body>
</html>
