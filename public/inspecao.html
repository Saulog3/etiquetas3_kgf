<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Inspecao Final</title>
  <link rel="stylesheet" href="style/style-inspecao-consulta.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <h1>Controle de Qualidade - Registro de Inspeção Final</h1>
    </header>

    <main class="card">
      <div class="card-body">
        <h2 class="section-title">Formulario de Inspeção</h2>

        <form id="formInspecao" class="form-grid">
          <div class="field">
            <label for="cilindroId">ID do Cilindro / OS</label>
            <input type="text" id="cilindroId" required>
          </div>

          <div class="field">
            <label for="data">Data da Inspeção</label>
            <input type="datetime-local" id="data" required>
          </div>

          <div class="field full">
            <label for="inspetor">Inspetor</label>
            <select name="inspetor" id="inspetor" required>
              <option value="">Selecione</option>
              <option value="Clovis de Assis">Clovis de Assis</option>
              <option value="Gilson Gonçalves">Gilson Gonçalves</option>
              <option value="Saulo Cunha">Saulo Cunha</option>
              <option value="Thiago Barbosa">Thiago Barbosa</option>
            </select>
          </div>

          <div class="field full">
            <span class="legend">Itens Verificados</span>
            <div class="check-grid">
              <label class="check-item"><input type="checkbox" value="Pintura">Pintura</label>
              <label class="check-item"><input type="checkbox" value="Travamento">Travamento</label>
              <label class="check-item"><input type="checkbox" value="Dimensoes">Dimensões</label>
              <label class="check-item"><input type="checkbox" value="Acabamento">Acabamento</label>
            </div>
          </div>

          <div class="field full">
            <label for="obs">Observações</label>
            <textarea id="obs" rows="3"></textarea>
          </div>

          <div class="field full">
            <label for="resultado">Resultado</label>
            <select id="resultado" required>
              <option value="">Selecione</option>
              <option value="Aprovado">Aprovado</option>
              <option value="Aprovado com Restrições">Aprovado com Restrições</option>
              <option value="Reprovado">Reprovado</option>
            </select>
          </div>

          <div class="field full actions">
            <button type="submit" class="btn-primary">Registrar</button>
          </div>
        </form>

        <div class="resultado" id="mensagem"></div>
      </div>
    </main>
  </div>

  <script>
    document.getElementById('formInspecao').addEventListener('submit', async function (e) {
      e.preventDefault();

      const itensSelecionados = Array.from(document.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);

      const dados = {
        cilindroId: document.getElementById('cilindroId').value,
        inspetor: document.getElementById('inspetor').value,
        data: document.getElementById('data').value,
        itens: itensSelecionados,
        obs: document.getElementById('obs').value,
        resultado: document.getElementById('resultado').value
      };

      try {
        const resposta = await fetch('http://192.168.0.146:3000/api/inspecao', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        });

        const msg = document.getElementById('mensagem');
        msg.style.display = 'block';

        if (resposta.ok) {
          msg.className = 'resultado success';
          msg.textContent = 'Inspecao registrada com sucesso!';
          document.getElementById('formInspecao').reset();
        } else {
          msg.className = 'resultado error';
          msg.textContent = 'Erro ao registrar inspecao.';
        }
      } catch (erro) {
        console.error('Erro:', erro);
        alert('Erro na conexao com o servidor.');
      }
    });
  </script>
</body>
</html>
