<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Consulta de Inspeções</title>
  <style>
    body { 
      font-family: Arial; 
      background: #f0f0f0; 
      padding: 20px; 
    }
    h2 { 
      text-align: center;
     }
    table { 
      width: 100%; 
      border-collapse: collapse; 
      background: white; 
      margin-top: 20px; }
    th, td { 
      padding: 10px; 
      border: 1px solid #ccc; 
      text-align: left; 
    }
    th { 
      background: #eee; 
    }
    .tag-aprovado { 
      color: green; 
      font-weight: bold; 
    }
    .tag-aprovado-restricoes { 
      color: #FFB800; 
      font-weight: bold; 
    }
    .tag-reprovado { 
      color: red; 
      font-weight: bold; 
    }
    .nav-filtros { 
      display: flex;
      flex-wrap: wrap; 
      gap: 30px; 
    }
      button {
    padding: 5px 20px;
    background: green;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
    button:hover {
      background: darkgreen;
    }
    input[type="text"], input[type="date"], select {
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h2>Consulta de Inspeções</h2>

  <div class="nav-filtros"   style="margin-bottom: 20px;">
    <label for="filtroCilindro">O.S.:</label>
    <input type="text" id="filtroCilindro" name="filtroCilindro">
    <label>Inspetor:
    <select name="inspetor" id="filtroInspetor">
      <option value="">Todos</option>
      <option value="Clovis de Assis">Clovis de Assis</option>
      <option value="Gilson Gonlçalves">Gilson Gonlçalves</option>
      <option value="Saulo Cunha">Saulo Cunha</option>
      <option value="Thiago Barbosa">Thiago Barbosa</option>
    </select>
    <label>Resultado:
      <select id="filtroResultado">
        <option value="">Todos</option>
        <option value="Aprovado">Aprovado</option>
        <option value="Aprovado com Restrições">Aprovado com Restrições</option>
        <option value="Reprovado">Reprovado</option>
      </select>
    </label>
    <label>Data: <input type="date" id="filtroDataInicio"></label>
    <!-- <label>Data final: <input type="date" id="filtroDataFim"></label> -->
    <button onclick="carregarInspecoes()">Filtrar</button>
  </div>

  <table id="tabelaInspecoes">
    <thead>
      <tr>
        <th>ID</th>
        <th>OS</th>
        <th>Inspetor</th>
        <th>Data</th>
        <th>Itens</th>
        <th>Resultado</th>
        <th>Observações</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function carregarInspecoes() {
      const inspetor = document.getElementById('filtroInspetor').value;
      const resultado = document.getElementById('filtroResultado').value;
      const dataInicio = document.getElementById('filtroDataInicio').value;
      // const dataFim = document.getElementById('filtroDataFim').value;
      const cilindro = document.getElementById('filtroCilindro').value;

      const params = new URLSearchParams();
      if (inspetor) params.append('inspetor', inspetor);
      if (resultado) params.append('resultado', resultado);
      if (dataInicio) params.append('inicio', dataInicio);
      // if (dataFim) params.append('fim', dataFim);
      if (cilindro) params.append('cilindro_id', cilindro);

      const resposta = await fetch('/api/inspecao?' + params.toString());
      const inspecoes = await resposta.json();

      const tbody = document.querySelector('#tabelaInspecoes tbody');
      tbody.innerHTML = ''; // limpa a tabela

      inspecoes.forEach(inspecao => {
        const tr = document.createElement('tr');
        const itensRaw = inspecao.itens ?? inspecao.itens_verificados ?? [];
        const itens = Array.isArray(itensRaw)
          ? itensRaw.join(', ')
          : JSON.parse(itensRaw || '[]').join(', ');
        const os = inspecao.cilindroId ?? inspecao.cilindro_id ?? '';
        const data = inspecao.data ?? inspecao.data_inspecao;
        const dataFormatada = data ? new Date(data).toLocaleString('pt-BR') : '';

        tr.innerHTML = `
          <td>${inspecao.id}</td>
          <td>${os}</td>
          <td>${inspecao.inspetor}</td>
          <td>${dataFormatada}</td>
          <td>${itens}</td>
          <td class="${inspecao.resultado === 'Aprovado' ? 'tag-aprovado' : inspecao.resultado === 'Aprovado com Restrições' ? 'tag-aprovado-restricoes' : 'tag-reprovado'}">${inspecao.resultado}</td>
          <td>${inspecao.obs ?? inspecao.observacoes ?? ''}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Carrega inicialmente sem filtro
    carregarInspecoes();
  </script>
</body>

</html>
