<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Inspecoes</title>
  <link rel="stylesheet" href="style/style-inspecao-consulta.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <h1>Controle de Qualidade - Consulta de Inspeções</h1>
    </header>

    <main class="card">
      <div class="card-body">
        <h2 class="section-title">Filtros e Histórico</h2>

        <div class="filters">
          <div class="field full-mobile">
            <label for="filtroCilindro">O.S.</label>
            <input type="text" id="filtroCilindro" name="filtroCilindro">
          </div>

          <div class="field">
            <label for="filtroInspetor">Inspetor</label>
            <select name="inspetor" id="filtroInspetor">
              <option value="">Todos</option>
              <option value="Clovis de Assis">Clovis de Assis</option>
              <option value="Gilson Gonçalves">Gilson Gonçalves</option>
              <option value="Saulo Cunha">Saulo Cunha</option>
              <option value="Thiago Barbosa">Thiago Barbosa</option>
            </select>
          </div>

          <div class="field">
            <label for="filtroResultado">Resultado</label>
            <select id="filtroResultado">
              <option value="">Todos</option>
              <option value="Aprovado">Aprovado</option>
              <option value="Aprovado com Restrições">Aprovado com Restrições</option>
              <option value="Reprovado">Reprovado</option>
            </select>
          </div>

          <div class="field">
            <label for="filtroDataInicio">Data</label>
            <input type="date" id="filtroDataInicio">
          </div>

          <div class="field">
            <button class="btn-primary" onclick="carregarInspecoes()">Filtrar</button>
          </div>
        </div>

        <div class="table-wrap">
          <table id="tabelaInspecoes">
            <thead>
              <tr>
                <th>ID</th>
                <th>OS</th>
                <th>Inspetor</th>
                <th>Data</th>
                <th>Itens</th>
                <th>Resultado</th>
                <th>Observações</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    function normalizarTexto(valor) {
      return (valor || '')
        .toString()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase();
    }

    function classeResultado(valor) {
      const v = normalizarTexto(valor);
      if (v === 'aprovado') return 'tag-aprovado';
      if (v.includes('restric')) return 'tag-aprovado-restrições';
      return 'tag-reprovado';
    }

    async function carregarInspecoes() {
      const inspetor = document.getElementById('filtroInspetor').value;
      const resultado = document.getElementById('filtroResultado').value;
      const dataInicio = document.getElementById('filtroDataInicio').value;
      const cilindro = document.getElementById('filtroCilindro').value;

      const params = new URLSearchParams();
      if (inspetor) params.append('inspetor', inspetor);
      if (resultado) params.append('resultado', resultado);
      if (dataInicio) params.append('inicio', dataInicio);
      if (cilindro) params.append('cilindro_id', cilindro);

      const resposta = await fetch('/api/inspecao?' + params.toString());
      const inspecoes = await resposta.json();

      const tbody = document.querySelector('#tabelaInspecoes tbody');
      tbody.innerHTML = '';

      inspecoes.forEach(inspecao => {
        const tr = document.createElement('tr');
        const itensRaw = inspecao.itens ?? inspecao.itens_verificados ?? [];
        const itens = Array.isArray(itensRaw)
          ? itensRaw.join(', ')
          : JSON.parse(itensRaw || '[]').join(', ');
        const os = inspecao.cilindroId ?? inspecao.cilindro_id ?? '';
        const data = inspecao.data ?? inspecao.data_inspecao;
        const dataFormatada = data ? new Date(data).toLocaleString('pt-BR') : '';

        tr.innerHTML = `
          <td>${inspecao.id}</td>
          <td>${os}</td>
          <td>${inspecao.inspetor}</td>
          <td>${dataFormatada}</td>
          <td>${itens}</td>
          <td class="${classeResultado(inspecao.resultado)}">${inspecao.resultado}</td>
          <td>${inspecao.obs ?? inspecao.observacoes ?? ''}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    carregarInspecoes();
  </script>
</body>
</html>
