<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Registro de Inspeção Final</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      padding: 20px;
    }

    .form-container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input, textarea, select {
      width: 95%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .checkboxes {
      margin-top: 10px;
    }

    .checkboxes label {
      font-weight: normal;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      background: green;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .result {
      margin-top: 20px;
      background: #e0ffe0;
      padding: 10px;
      border-radius: 5px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Registro de Inspeção Final</h2>
    <form id="inspectionForm">

      <label for="cilindroId">OS</label>
      <input type="text" id="cilindroId" required>
      
      <label for="data">Data da Inspeção</label>
      <input type="datetime-local" id="data" required>
      
      <label for="inspetor">Responsável pela Inspeção</label>
      <select name="inspetor" id="inspetor" required>
        <option value="">Selecione</option>
        <option value="Clovis de Assis">Clovis de Assis</option>
        <option value="Gilson Gonlçalves">Gilson Gonlçalves</option>
        <option value="Saulo Cunha">Saulo Cunha</option>
        <option value="Thiago Barbosa">Thiago Barbosa</option>
      </select>

      <label>Itens Verificados</label>
      <div class="checkboxes">
        <label><input type="checkbox" value="Pintura"> Pintura</label required><br>
        <label><input type="checkbox" value="Travamento"> Travamento</label required><br>
        <label><input type="checkbox" value="Dimensões"> Dimensões</label required><br>
        <label><input type="checkbox" value="Acabamento"> Acabamento</label required>
      </div>

      <label for="obs">Observações</label>
      <textarea id="obs" rows="3"></textarea>

      <label for="resultado">Resultado Final</label>
      <select id="resultado" required>
        <option value="">Selecione</option>
        <option value="Aprovado">Aprovado</option>
        <option value="Reprovado">Reprovado</option>
      </select>

      <button type="submit">Salvar Registro</button>
    </form>

    <div class="result" id="output"></div>
  </div>

  <script>
    document.getElementById("inspectionForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const id = document.getElementById("cilindroId").value;
      const inspetor = document.getElementById("inspetor").value;
      const data = document.getElementById("data").value;
      const obs = document.getElementById("obs").value;
      const resultado = document.getElementById("resultado").value;

      const itens = Array.from(document.querySelectorAll(".checkboxes input:checked"))
                         .map(cb => cb.value);

      const registro = {
        id,
        inspetor,
        data,
        itens,
        obs,
        resultado
      };

      // Exibe resultado na tela (simula o "salvamento")
      const output = document.getElementById("output");
      output.style.display = "block";
      output.innerText = `Registro Salvo:\n\n${JSON.stringify(registro, null, 2)}`;
      
      // Limpa o formulário
      document.getElementById("inspectionForm").reset();
    });
  </script>
</body>
</html>
