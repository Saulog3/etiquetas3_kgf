<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Sistema Qualidade</title>
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="style/style-index.css">
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <img class="logo" src="img/Logo KGF - BG - Removed - Adjusted.png" alt="Logo KGF">
            <h1 class="title">CONTROLE DE QUALIDADE</h1>
        </header>

        <main class="menu-card" aria-label="Menu principal">
            <h2 class="menu-title">Serviços</h2>
            <div class="menu-grid menu-grid-3">
                <button class="menu-button" onclick="irParaPagina('./choose.html')">
                    Sistema de <strong>Plaquetas</strong>
                </button>
                <button class="menu-button" onclick="irParaPagina('./inspecao.html')">
                    Registro de <strong>Inspeção</strong>
                </button>
            </div>
        </main>

        <br>

        <div class="menu-card" aria-label="Menu principal">
            <h2 class="menu-title">Relatórios</h2>
            <div class="menu-grid menu-grid-3">
                <button class="menu-button" onclick="irParaPagina('../pages/libcilindros.html')">
                    Resumo <strong>Liberação de Cilindros</strong>
                </button>
                <button class="menu-button" onclick="irParaPagina('../pages/resumo_inspecao_pecas.html')">
                    Resumo - <strong>Inspeção de Peças</strong>
                </button>
                <button class="menu-button" onclick="irParaPagina('./consulta.html')">
                    Consulta de <strong>Inspeções de Cilindros</strong>
                </button>
                <button class="menu-button" onclick="irParaPagina('../pages/resumo_analise_garantias.html')">
                    Resumo de <strong>Garantias</strong>
                </button>
                <button class="menu-button" onclick="irParaPagina('../pages/resumo_peritagens.html')">
                    Resumo de <strong>Peritagens</strong>
                </button>
            </div>
        </div>
    </div>

    <script>
        function irParaPagina(url) {
            window.location.href = url;
        }
    </script>
</body>
</html>
